run:
  id: v0061-smoke-5
  profile: technical-full
  ansible_lint_scope: v005-selected
  workers: 2
  repository_timeout: 3600
  resume: true
  stop_on_error: false

tool:
  mode: current-worktree
  version: 0.0.6.1
  git_ref: HEAD
  python: .venv/bin/python

repositories:
  manifest: study/manifests/pilot-five-frozen.csv
  file_manifests_dir: study/manifests/file-classification
  expected_count: 5

output:
  root: study/runs

providers:
  # Partial ansible-lint repositories remain visible but are excluded from
  # provider-comparison datasets; internal AnsibleGuard evidence stays valid.
  require_ansible_lint: false
  require_gitleaks: true

report:
  formats: [svg]
  top_rules: 25
  top_repositories: 25
