run:
  id: v007-variable-resolution-207
  profile: technical-full
  ansible_lint_scope: v005-selected
  workers: 4
  repository_timeout: 3600
  resume: true
  stop_on_error: false

tool:
  mode: current-worktree
  version: 0.0.7
  git_ref: HEAD
  python: .venv/bin/python
  # The comparison run includes the current variable-resolution implementation
  # and locally generated frozen cohort artifacts.
  allow_dirty: true

repositories:
  manifest: study/manifests/github-207-local-frozen.csv
  file_manifests_dir: study/manifests/file-classification-v007-207
  expected_count: 207

output:
  root: study/runs

providers:
  # Preserve internal evidence even where the external provider is partial.
  require_ansible_lint: false
  require_gitleaks: true

report:
  formats: [svg]
  top_rules: 25
  top_repositories: 25
