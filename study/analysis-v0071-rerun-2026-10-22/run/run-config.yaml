run:
  # This identifier is part of the reproducibility contract; do not reuse it
  # for a different manifest, ruleset, or tool commit.
  id: v0071-rerun-2026-10-22
  profile: technical-full
  ansible_lint_scope: v005-selected
  # The full run intentionally uses no more than four concurrent repository
  # jobs.  This is also enforced by the canonical wrapper.
  workers: 4
  repository_timeout: 1800
  resume: true
  stop_on_error: false

tool:
  mode: current-worktree
  version: 0.0.7.1
  git_ref: HEAD
  # Omitted deliberately: study_pipeline uses sys.executable, so this works
  # in CI, containers, and virtual environments without a repository-local
  # .venv path.
  allow_dirty: false

repositories:
  # Tracked authoritative frozen source.  Local checkout paths are generated
  # during acquisition and are never a source of population identity.
  manifest: study/manifests/github-v2-final-eligible.csv
  file_manifests_dir: study/manifests/file-classification-v007-207
  expected_count: 207
  checkout_root: study/cache/v0071-rerun-2026-10-22/repositories
  # Existing local clones are usable only after the runner independently
  # proves their exact frozen SHA and a clean worktree. They are a download
  # cache, never a source of analytical outputs.
  verified_checkout_cache: /home/aymmzn/Documents/AnsibleChecklist/study/repositories

output:
  root: study/runs

providers:
  # Preserve internal evidence even where the external provider is partial.
  require_ansible_lint: false
  require_gitleaks: true

report:
  formats: [svg, png]
  top_rules: 25
  top_repositories: 25
