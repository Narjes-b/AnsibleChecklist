[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ansibleguard"
version = "0.1.0"
description = "IaC smell detector for Ansible playbooks"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0,<7",
    "ruamel.yaml==0.19.1",
    "regex>=2024.11,<2027",
    "pandas>=2.2,<4",
    "spacy>=3.8,<4",
    "nltk>=3.9,<4",
    "ansiblemetrics==0.4.2",
    "ansible-lint>=26.4,<27",
    "ansible-compat>=26.3,<27",
    "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "jsonschema>=4.23,<5",
]

[project.scripts]
ansibleguard = "ansibleguard.cli:main"
ansibleguard-pr-annotations = "ansibleguard.report.pr_annotations:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ansibleguard = ["thresholds.csv", "report/schemas/*.json"]
