name: Test AnsibleGuard

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package and test dependencies
        run: pip install -e '.[dev]'
      - name: Run tests
        run: pytest -q
      - name: Package import smoke test
        run: python -c "import ansibleguard; from ansibleguard.cli import main"
