name: AnsibleGuard PR scan

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install AnsibleGuard
        run: pip install -e .
      - name: Install semantic analysis data
        run: |
          python -m spacy download en_core_web_lg
          python -c "import nltk; nltk.download('wordnet', quiet=True)"
      - name: Install gitleaks
        run: ansibleguard install-tools

      - name: Scan pull-request head
        if: github.event_name == 'pull_request'
        env:
          ANSIBLEGUARD_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          ANSIBLEGUARD_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: ansibleguard . -o ansibleguard-head --profile pr --fail-on never

      - name: Scan pull-request base
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_TREE: ${{ runner.temp }}/ansibleguard-base
          ANSIBLEGUARD_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          ANSIBLEGUARD_HEAD_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git worktree add --detach "$BASE_TREE" "$BASE_SHA"
          ansibleguard "$BASE_TREE" -o ansibleguard-base --profile pr --fail-on never

      - name: Compare base and head
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          python scripts/compare_pr_results.py \
            ansibleguard-base/canonical/occurrences.json \
            ansibleguard-head/canonical/occurrences.json \
            --policy observe \
            --head-output ansibleguard-head \
            -o ansibleguard-pr-decision.json

      - name: Scan pushed branch
        if: github.event_name == 'push'
        run: ansibleguard . -o ansibleguard-head --profile technical-full --fail-on never

      - name: Publish introduced PR annotations
        if: >-
          always() &&
          github.event_name == 'pull_request' &&
          hashFiles('ansibleguard-pr-decision.json') != ''
        run: >-
          ansibleguard-pr-annotations ansibleguard-pr-decision.json
          --limit 50
          --summary "$GITHUB_STEP_SUMMARY"

      - name: Publish scan summary
        if: always() && hashFiles('ansibleguard-head/summary.csv') != ''
        run: |
          echo '## AnsibleGuard scan' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo 'Raw detector results and canonical occurrences are attached as an artifact.' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '```csv' >> "$GITHUB_STEP_SUMMARY"
          head -n 21 ansibleguard-head/summary/summary.csv >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if test -f ansibleguard-pr-decision.json; then
            echo '' >> "$GITHUB_STEP_SUMMARY"
            echo '### Pull-request comparison' >> "$GITHUB_STEP_SUMMARY"
            python -c "import json; p=json.load(open('ansibleguard-pr-decision.json')); print(json.dumps(p['policy'], indent=2))" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload SARIF
        continue-on-error: true
        if: >-
          always() &&
          hashFiles('ansibleguard-head/canonical/findings.sarif') != '' &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ansibleguard-head/canonical/findings.sarif
          category: ansibleguard

      - name: Upload detailed reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ansibleguard-results
          path: |
            ansibleguard-head/
            ansibleguard-base/
            ansibleguard-pr-decision.json
          if-no-files-found: error

      - name: Enforce policy
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib
          import sys

          head = pathlib.Path("ansibleguard-head")
          diagnostic_files = [head / "diagnostics.json"]
          base_diagnostics = pathlib.Path("ansibleguard-base/diagnostics.json")
          if base_diagnostics.exists():
              diagnostic_files.append(base_diagnostics)
          diagnostics = [
              item
              for diagnostic_file in diagnostic_files
              for item in json.loads(diagnostic_file.read_text())
          ]
          tool_errors = [item for item in diagnostics if item["status"] == "tool-error"]
          if tool_errors:
              print(f"Blocking: {len(tool_errors)} external-tool error(s)")
              sys.exit(1)

          decision = pathlib.Path("ansibleguard-pr-decision.json")
          if (
              os.environ.get("GITHUB_EVENT_NAME") == "pull_request"
              and not decision.exists()
          ):
              print("Blocking: pull-request comparison did not produce a decision")
              sys.exit(1)
          if decision.exists():
              policy = json.loads(decision.read_text())["policy"]
              if policy["conclusion"] == "failure":
                  print(
                      "Blocking introduced occurrences:",
                      ", ".join(policy["blocking_occurrence_ids"]),
                  )
                  sys.exit(1)
          else:
              print("Push scan completed in observe mode; reports are artifacts.")
          PY
